<!DOCTYPE html>
<html>
    <body>
        <a href="{% url 'users_list' %}">Go to Users list</a>
        <h3>{{ user.first_name }}: User Permissions</h3>
        <form method="post" action="{% url 'update_permissions' user_id=user.id %}">
            {% csrf_token %}
            {{ astrouserpermissions.permissions }}
            {% if perms.accounts.manage_all_permissions %}
                <button>Save</button>
            {% endif %}
        </form>
    </body>
</html>
