services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    # ports:
    #   - "8000:8000"
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      planner_db:
        condition: service_healthy
    networks:
      - planner_ntwk

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"
    expose:
      - 6379
    networks:
      - planner_ntwk

  celery-beat:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: celery -A astro_planner beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - planner_ntwk

  celery-worker:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: celery -A astro_planner worker --loglevel=INFO
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - planner_ntwk

  planner_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # ports:
    #   - "5432:5432"
    expose:
      - 5432
    volumes:
      - planner_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planner_ntwk

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
      - ./static:/code/static
    depends_on:
      - app
    networks:
      - planner_ntwk

  openssl:
    image: alpine/openssl
    volumes:
      - ./certs:/certs
    command: >
      req -x509 -nodes -newkey rsa:4096 -keyout /certs/cert.key
      -out /certs/cert.crt -days 365
      -subj "/C=BG/ST=Plovdiv/L=Plovdiv/O=MyProject/OU=Development/CN=localhost"

networks:
  planner_ntwk:
    driver: bridge

volumes:
  planner_db_data:
